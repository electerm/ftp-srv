name: Publish to npm

# Auth is npm trusted publishing (OIDC): no NPM_TOKEN secret anywhere. One-time
# setup on npmjs.com → @electerm/ftp-srv → Settings → Trusted Publisher, pointing
# at repo `electerm/ftp-srv` and workflow file `npm-publish.yml`.
#
# Bumping the version in package.json on `main` (or `npm version patch`) is the
# whole release procedure.

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write is REQUIRED for trusted publishing (and provenance) to work.
permissions:
  contents: read
  id-token: write

# Never let two publishes race for the same version. A queued run re-checks the
# registry after the first one finishes, finds the version published, and skips.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    # `[skip ci]` is already honoured natively by GitHub Actions; `[skip npm]`
    # lets a commit run the other workflows but skip this one. Because `publish`
    # needs this job, skipping here skips the whole workflow.
    if: ${{ !contains(github.event.head_commit.message, '[skip npm]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check whether this version is already published
        id: version
        run: |
          set -eu
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          echo "package.json says $pkg@$ver"

          # `npm view <pkg>@<ver> version` exits 0 when the version exists and
          # exits 1 with E404 when it does not.
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "$pkg@$ver is already on npm — nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$pkg@$ver is not published yet — will build and publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          if [ "${{ steps.version.outputs.publish }}" = "true" ]; then
            echo "### New version to publish :rocket:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Already published — skipping build and publish :white_check_mark:" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm >= 11.5.1, the minimum for trusted publishing.
          # No `registry-url` on purpose: it makes setup-node write a placeholder
          # `_authToken` into .npmrc, which sends npm down the token path and
          # fails the OIDC exchange with ENEEDAUTH.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        # Call `npm publish` directly — do not wrap it in @jsdevtools/npm-publish:
        # that wrapper writes a temp .npmrc with `_authToken=${NODE_AUTH_TOKEN}`
        # and sets NODE_AUTH_TOKEN='', so npm never does the OIDC exchange.
        # If the version did appear between the `check` job and now, npm refuses
        # with E403 ("cannot publish over the previously published versions").
        run: npm publish --provenance --access public
